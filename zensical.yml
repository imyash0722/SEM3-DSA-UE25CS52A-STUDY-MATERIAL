site_name: Data Structures & Applications Exam Prep — UE25CS52A
site_description: Complete study guide for DSA (UE25CS52A) covering Units 1-4 with code examples, algorithms, and exam patterns
site_author: Course Prep Team
site_url: https://imyash0722.github.io/DSA-UE25CS52A-SEM3-STUDY-MATERIAL/

repo_url: https://github.com/imyash0722/DSA-UE25CS52A-SEM3-STUDY-MATERIAL
repo_name: GitHub

theme:
  name: zensical
  custom_dir: overrides
  language: en
  palette:
    # Light scheme (default)
    - scheme: default
      primary: indigo
      accent: indigo
    # Dark scheme (slate)
    - scheme: slate
      primary: indigo
      accent: indigo

  features:
    - navigation.tabs           # Top horizontal unit tabs
    - navigation.sections       # Collapsible sections
    - navigation.expand         # Auto-expand sections
    - navigation.top            # Back to top button
    - navigation.tracking       # URL updates with scroll position
    - navigation.footer         # Next page and Previous page buttons at bottom of current page
    - search.highlight          # Highlight search terms in pages
    - search.share              # Shareable search links
    - content.code.copy         # Click-to-copy code blocks
    - content.code.annotate     # Code block annotations
    - content.tabs.link         # Link tabbed content across pages
    - toc.follow                # Auto-scrolling right table of contents
    - color.mode                # Palette mode switching support

extra_javascript:
  - assets/javascripts/theme-toggle.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - footnotes

nav:
  - HOME: index.md
  - UNIT 1:
      - "Course Overview & ADT": unit1/theory/unit1_01_course_overview_adt.md
      - "Memory Allocation": unit1/theory/unit1_02_memory_allocation.md
      - "Dynamic Memory Functions": unit1/theory/unit1_03_dynamic_memory_functions.md
      - "SLL - Node Structure": unit1/theory/unit1_04_sll_node_structure.md
      - "SLL - Insertion": unit1/theory/unit1_05_sll_insertion.md
      - "SLL - Deletion": unit1/theory/unit1_06_sll_deletion.md
      - "Doubly Linked List": unit1/theory/unit1_07_doubly_linked_list.md
      - "Circular Linked List": unit1/theory/unit1_08_circular_linked_list.md
      - "Anchor Programs": unit1/theory/unit1_09_anchor_programs.md
  - UNIT 2:
      - "Stack - Array": unit2/theory/unit2_01_stack_array.md
      - "Stack - Linked List": unit2/theory/unit2_02_stack_linked_list.md
      - "Stack Applications": unit2/theory/unit2_03_stack_applications.md
      - "Queue - Linked List": unit2/theory/unit2_04_queue_linked_list.md
      - "Circular Array Queue": unit2/theory/unit2_05_circular_array_queue.md
      - "Priority Queue Concepts": unit2/theory/unit2_06_priority_queue_concepts.md
      - "PQ - Unordered List": unit2/theory/unit2_07_pq_unordered_list.md
      - "PQ - Ordered List": unit2/theory/unit2_08_pq_ordered_list.md
      - "PQ - Unordered Array": unit2/theory/unit2_09_pq_unordered_array.md
      - "PQ - Ordered Array": unit2/theory/unit2_10_pq_ordered_array.md
      - "Deque": unit2/theory/unit2_11_deque.md
      - "Anchor Programs": unit2/theory/unit2_11_anchor_programs.md
  - UNIT 3:
      - "Detailed Walkthrough": unit3_walkthrough.md
      - "Example Programs": unit3/unit3_complete_walkthrough.md
  - UNIT 4:
      - "Detailed Walkthrough": unit4_walkthrough.md
      - "Example Programs": unit4/unit4_complete_walkthrough.md
  - REF: INDEX.md

copyright: "Data Structures & Applications (UE25CS52A) Study Guide | Based on Tenenbaum & Kruse"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/imyash0722
