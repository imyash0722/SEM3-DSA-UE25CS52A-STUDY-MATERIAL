site_name: Data Structures & Applications Exam Prep — UE25CS52A
site_description: Complete study guide for DSA (UE25CS52A) covering Units 1-3 with code examples, algorithms, and exam patterns
site_author: Course Prep Team
site_url: https://imyash0722.github.io/SEM3-DSA-UE25CS52A-STUDY-MATERIAL/

repo_url: https://github.com/imyash0722/SEM3-DSA-UE25CS52A-STUDY-MATERIAL
repo_name: GitHub

theme:
  name: zensical
  custom_dir: overrides
  language: en
  palette:
    # Light scheme (default)
    - scheme: default
      primary: indigo
      accent: indigo
    # Dark scheme (slate)
    - scheme: slate
      primary: indigo
      accent: indigo

  features:
    - navigation.tabs           # Top horizontal unit tabs
    - navigation.sections       # Collapsible sections
    - navigation.expand         # Auto-expand sections
    - navigation.top            # Back to top button
    - navigation.tracking       # URL updates with scroll position
    - navigation.footer         # Next page and Previous page buttons at bottom of current page
    - search.highlight          # Highlight search terms in pages
    - search.share              # Shareable search links
    - content.code.copy         # Click-to-copy code blocks
    - content.code.annotate     # Code block annotations
    - content.tabs.link         # Link tabbed content across pages
    - toc.follow                # Auto-scrolling right table of contents
    - color.mode                # Palette mode switching support

extra_javascript:
  - assets/javascripts/theme-toggle.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - footnotes

nav:
  - Home: index.md
  - "Unit 1: Foundations, Lists, Stacks, ADTs":
      - "Unit 1 Overview": unit1_01_functions_and_pointers.md
      - "Example Programs": unit1_02_example_programs.md
      - "Detailed Topics":
          - "1.1 Functions and Pointers": unit1/1.1_functions_and_pointers.md
          - "1.2 Functions Continued": unit1/1.2_functions_continued.md
          - "2.1 Arrays": unit1/2.1_arrays.md
          - "2.2 Multidimensional Arrays": unit1/2.2_multidimensional_arrays.md
          - "3.1 Structures": unit1/3.1_structures.md
          - "4.1 Dynamic Memory": unit1/4.1_dynamic_memory.md
          - "5.1 Abstract Data Types": unit1/5.1_abstract_data_type.md
          - "6.1 Linked Lists": unit1/6.1_linked_lists.md
          - "7.1 Header Node Lists": unit1/7.1_header_node.md
          - "8.1 Multilists & Skiplists": unit1/8.1_multilists_skiplists.md
          - "9.1 Stacks": unit1/9.1_stacks.md
          - "10.1 Stack Applications": unit1/10.1_stack_applications.md
  - "Unit 2: Circular Lists, Queues, Priority Queues":
      - "Unit 2 Overview": unit2_circular_dll_queue_pq.md
      - "Example Programs": unit2_example_programs.md
      - "Detailed Topics":
          - "1.1 Circular Lists": unit2/1.1_circular_list.md
          - "2.1 Doubly Linked Lists": unit2/2.1_doubly_linked_list.md
          - "3.1 Queue (Linked List)": unit2/3.1_queue_linked_list.md
          - "4.1 Circular Queue (Array)": unit2/4.1_circular_queue_array.md
          - "5.1 Priority Queue": unit2/5.1_priority_queue.md
          - "6.1 Deque": unit2/6.1_deque.md
          - "7.1 Binary Trees & BST": unit2/7.1_binary_trees_bst.md
          - "8.1 PQ Implementations": unit2/8.1_pq_implementations.md
  - "Unit 3: Trees, Heaps, Balanced Trees, Graphs":
      - "Unit 3 Overview": unit3_trees_heaps_avl_splay_graphs.md
      - "Example Programs": unit3_example_programs.md
      - "Detailed Topics":
          - "3.1 Trees & BST": unit3/3.1_trees_bst.md
          - "3.2 Array Trees": unit3/3.2_array_trees.md
          - "3.3 Expression Trees": unit3/3.3_expression_trees.md
          - "3.4 Threaded Trees": unit3/3.4_threaded_trees.md
          - "3.5 Heaps & PQ": unit3/3.5_heaps.md
          - "3.6 AVL Trees": unit3/3.6_avl_trees.md
